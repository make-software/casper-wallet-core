version: 2
updates:
  # npm dependencies — grouped to reduce PR noise
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        # Keep major bumps separate so they get individual review
        exclude-patterns:
          - 'casper-js-sdk'

  # GitHub Actions used by workflows
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: chore(ci)
    groups:
      actions:
        applies-to: version-updates
        update-types:
          - minor
          - patch
