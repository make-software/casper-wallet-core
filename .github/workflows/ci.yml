name: CI

on:
  push:
    branches: [master, 'release/**']
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Node 22 — lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Type-check + lint
        run: yarn code:check

      # Enforcement gate that complements Dependabot (which only detects and opens
      # PRs): this fails the build on new high/critical advisories so vulnerable
      # code can't be merged. Audits the whole tree (dev + transitive); low/moderate
      # are intentionally NOT gated (noise). Consciously-accepted, currently
      # unfixable advisories live in .yarnrc.yml -> npmAuditIgnoreAdvisories.
      - name: Audit dependencies (fail on high/critical)
        run: yarn npm audit --all --severity high --recursive

      - name: Run unit tests
        run: yarn test --ci --coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14
