nodeLinker: node-modules

yarnPath: .yarn/releases/yarn-4.2.2.cjs
enableScripts: false

# --- Dependency-audit escape hatch -------------------------------------------
# The CI "Audit dependencies" step runs:
#   yarn npm audit --all --severity high --recursive
# and fails the build on any high/critical advisory. Ids listed here are the
# only ones excluded from that gate — everything else stays enforced.
#
# Yarn 4 matches the NUMERIC npm advisory id below (the GHSA slug is NOT matched).
# Keep this list minimal. Add an entry ONLY for a high/critical that is both
# dev-only (never shipped to library consumers) AND has no available fix yet.
# Every entry MUST document its package, GHSA, and reason, e.g.:
#   - 'NNNNNNN' # GHSA-xxxx-xxxx-xxxx — <package>: <why accepted / when to revisit>
npmAuditIgnoreAdvisories:
  # lodash <=4.17.23 — code injection via _.template (GHSA-r5fr-rjxr-66jc, high).
  # Dev-only: transitive via @react-native/eslint-config -> eslint-plugin-ft-flow
  # (the project's ESLint preset); not part of the published package. 4.17.21 is
  # the latest published lodash, so there is no fix. Revisit if lodash ships one.
  - '1115806'
